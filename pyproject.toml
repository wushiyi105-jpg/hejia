[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hejia"
version = "0.1.0"
description = "装修报价核查 Agent —— 复算每一行、揪出重复计费与漏项"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
hejia = "hejia.cli:main"

[tool.setuptools]
packages = ["hejia"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
